version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
      - dependency-name: 'vue'
        update-types:
          - version-update:semver-major
      - dependency-name: 'vue-router'
        update-types:
          - version-update:semver-major
      - dependency-name: 'vue-i18n'
        update-types:
          - version-update:semver-major
      - dependency-name: '@mycore-org/vue-components'
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: '@jsr/mycore__js-common'
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      npm:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      npm-major:
        patterns:
          - '*'
        update-types:
          - major
        group-by: dependency-name
